server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location ~ \.webmanifest$ { default_type application/manifest+json; add_header Cache-Control "no-cache" always; }
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;
    location = /sw.js { add_header Cache-Control "no-cache" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; }
    gzip on;
    gzip_types text/javascript application/javascript text/css application/json image/svg+xml;
}
