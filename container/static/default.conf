server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location ~ \.webmanifest$ { default_type application/manifest+json; expires -1; }
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # The opt-in downloader is a separate opaque-origin frame; the IDE stays same-origin-only.
    location ~ /remote-images\.html$ {
        add_header X-Content-Type-Options nosniff always;
        expires -1;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src https:; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    }
    location = /sw.js { expires -1; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ =404; expires -1; }
    gzip on;
    gzip_types text/javascript application/javascript text/css application/json image/svg+xml;
}
